<head>

<style>
/* Layout: single reading column, exam-paper sheets per section, sticky tab bar */
:root{
  --bg:#eef2f4; --paper:#ffffff; --ink:#1d2a30; --muted:#5d6b72; --line:#d5dde1;
  --box:#f1f4f5; --accent:#1b7fb3; --accent-ink:#ffffff;
  --ok:#1f8a4c; --ok-bg:#e3f4ea; --bad:#c2402f; --bad-bg:#fbe7e3;
  --f-ui:"IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-text:"Gowun Batang","Nanum Myeongjo",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181b; --paper:#1a2226; --ink:#e4ecef; --muted:#9aaab1; --line:#2f3b40;
  --box:#222c31; --accent:#4fb0e3; --accent-ink:#0d1a20;
  --ok:#5fcf8d; --ok-bg:#183326; --bad:#f08776; --bad-bg:#3a201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181b; --paper:#1a2226; --ink:#e4ecef; --muted:#9aaab1; --line:#2f3b40;
  --box:#222c31; --accent:#4fb0e3; --accent-ink:#0d1a20;
  --ok:#5fcf8d; --ok-bg:#183326; --bad:#f08776; --bad-bg:#3a201c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px}
.tab{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.meta{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{border:1px solid var(--line);background:var(--paper);padding:4px 10px;border-radius:6px}
.chip b{color:var(--ink)}
.namebox{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:700}
.namebox{flex-wrap:wrap}
.namebox input{font:inherit;font-weight:400;width:8em;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.namebox input.need{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-bg)}
.save{font-size:13px;font-weight:700}.save.ok{color:var(--ok)}.save.bad{color:var(--bad)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px 22px;margin-top:18px}
.sheet h1{font-size:22px;margin:0 0 4px}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 8px}
.group{margin-top:28px}
.group-h{display:flex;gap:10px;align-items:baseline;font-weight:700;margin:0 0 12px}
.group-h .rng{color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.passage{font-family:var(--f-text);background:var(--box);border-radius:8px;padding:14px 16px;margin:0 0 14px;line-height:1.85}
.passage p{margin:0 0 .6em;text-indent:1em}.passage p:last-child{margin-bottom:0}
.passage.ad{background:transparent;border:1px dashed var(--line);text-align:center}
.passage.ad p{text-indent:0}.passage .ad-t{font-weight:700;font-size:19px}
.passage.headline{background:transparent;border:2px solid var(--ink);text-align:center;font-family:var(--f-ui);font-weight:700;font-size:19px}
.passage .items p{text-indent:0;padding-left:2.4em;text-indent:-2.4em}
.bogi{font-family:var(--f-text);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:-4px 0 14px}
.q{margin:0 0 22px}
.q-t{margin:0 0 8px;display:flex;gap:8px}
.q-t .n{font-weight:700;font-variant-numeric:tabular-nums;min-width:1.6em}
.q-t .s{font-family:var(--f-text);min-width:0}
.blank{display:inline-block;min-width:5.5em;border-bottom:1.5px solid var(--ink);margin:0 2px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-left:2.2em}
.opts.wide{grid-template-columns:1fr}
@media (max-width:520px){.opts{grid-template-columns:1fr;padding-left:0}}
.opt{display:flex;gap:8px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible,.tab:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .m{font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .m{color:var(--accent)}
.graded .opt{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}.opt.ok .m{color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}.opt.bad .m{color:var(--bad)}
.verdict{font-size:13px;font-weight:700;margin-left:auto;white-space:nowrap}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;padding-top:18px;border-top:1px solid var(--line);align-items:center}
.btn{font:inherit;font-weight:700;padding:10px 18px;border-radius:8px;border:1px solid var(--accent);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.result{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:13px}
u{text-underline-offset:3px}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .15s,background .15s}}
</style>
</head>

<script type="module">
// ===== Firebase (Learning Korean with AI 프로젝트) =====
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyDhggUZfNi6POHz1qdfLoilKfEaqgWhdyo",authDomain:"learning-korean-with-ai.firebaseapp.com",projectId:"learning-korean-with-ai",storageBucket:"learning-korean-with-ai.appspot.com",messagingSenderId:"910630520783",appId:"1:910630520783:web:0cf02dbeadff7ae46be48e"};
const db = getFirestore(initializeApp(firebaseConfig));
const collectionName = "snukorean_4a_1_3_review";
// 문서 이름 = 학번_이름_영역_날짜시간 (예: 2014030309_이은기_읽기_1003-1452)
window.saveResult = (data) => {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const stamp = `${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  const docId = `${data.studentId}_${data.studentName}_${data.section}_${stamp}`.replace(/[\/\s]+/g, "");
  return setDoc(doc(db, collectionName, docId), { ...data, submittedAt: serverTimestamp(), submittedAtLocal: d.toLocaleString("ko-KR") });
};
</script>
<script>
const B = '<span class="blank"></span>';
const SECTIONS = {
 a:{title:'평가하기', limit:10, groups:[
  {rng:'[1–3]', h:`( )에 들어갈 가장 알맞은 것을 고르십시오.`, qs:[
   {s:`내 동생은 (${B}) 가방이나 신발을 직접 만들기도 하는데 보는 사람마다 모두 예쁘다고 칭찬한다.`, o:['설득력이 있으면','손재주가 좋아서','책임감이 강하면서','이해가 빠르기 때문에'], a:1},
   {s:`어제 날씨가 추웠는데 스키장에서 스키를 오래 탔더니 감기에 걸린 것 같다. 말도 하기 힘들 정도로 (${B}).`, o:['눈이 침침하다','목이 뻣뻣하다','가슴이 답답하다','목이 따끔거린다'], a:3},
   {s:`나는 아무리 예뻐 보이는 물건이라도 실제로 사용하는 데에 불편할 것 같으면 사지 않는다. 예술적인 것보다는 (${B})인 것을 중요하게 생각하기 때문이다.`, o:['실용적','사교적','적극적','긍정적'], a:0},
  ]},
  {rng:'[4–6]', h:'밑줄 친 부분과 의미가 비슷한 것을 고르십시오.', qs:[
   {s:`야외에서 운동을 하면 건강에도 <u>좋을 뿐만 아니라</u> 스트레스도 풀 수 있어서 좋다.`, o:['좋고','좋지만','좋더니','좋다가'], a:0},
   {s:`자기 생각 없이 다른 사람이 <u>하라는 대로</u> 사는 사람은 크게 성공할 수 없다.`, o:['할 정도로','하다가는','하라는 것과 똑같이','하라고 하다 보면'], a:2},
   {s:`옆에 앉은 사람이 자꾸 말을 <u>거는 바람에</u> 지하철에서 내릴 역을 놓쳐 버렸다.`, o:['거는데','걸어서','거느라고','걸더니'], a:1},
  ]},
  {rng:'[7–10]', h:'( )에 알맞은 것을 고르십시오.', qs:[
   {p:`<p>지현이는 자기가 우리 반 대표로 학교 축구 경기에 나가겠다고 했다. 축구를 배운 지 얼마 되지 않았는데 왜 그렇게 (${B})지 알 수가 없다.</p>`, o:['정정당당한','자신만만한','아슬아슬한','흥미진진한'], a:1},
   {p:`<p>나는 분위기가 좋은 커피숍이나 레스토랑에서 식사하는 것을 좋아한다. 어머니는 월급에 비해서 돈을 많이 쓴다고 걱정하시지만 나는 열심히 일한 나를 위해 그 정도 돈을 쓰는 것은 (${B})이/가 아니라고 생각한다.</p>`, o:['과로','과음','과식','과소비'], a:3},
   {p:`<p>민수 씨는 프랑스에 있는 대학교에 입학한 후 프랑스에서 10년이 넘게 살았다. 그래서 프랑스 사람이라고 말해도 (${B}) 프랑스어를 잘한다.</p>`, o:['믿는지','믿다 보면','믿는 대로','믿을 정도로'], a:3},
   {p:`<p>우리 형은 편식이 심해서 채소는 안 먹고 고기만 먹는다. 어머니는 형에게 그렇게 고기만 (${B}) 병에 걸릴 수 있다고 늘 잔소리를 하신다.</p>`, o:['먹다가는','먹다 보니','먹으나 마나','먹는 바람에'], a:0},
  ]},
  {rng:'[11]', h:'다음은 자기소개서의 일부입니다. ( )에 알맞은 것을 고르십시오.', qs:[
   {p:`<p style="text-indent:0"><b>동물학과를 선택하게 된 이유는 무엇입니까?</b></p><p>저는 어려서부터 동물을 좋아했습니다. 하루 종일 강아지와 같이 뛰어다니면서 놀기도 하고 개미들이 기어가는 것을 보면서 왜 저렇게 계속 일하고 있는지 궁금해하기도 했습니다. 그렇게 동물이 좋았고 동물에 대해서 알고 싶은 것이 많았습니다. 그래서 저는 (${B}) 고민하지 않고 동물학과를 선택하게 되었습니다.</p>`, o:['소질이 있지만','적성이 맞으면','진로를 정할 때','전공을 살리기 위해서'], a:2},
  ]},
  {rng:'[12]', h:'다음은 사전의 일부입니다. ( )에 알맞은 것을 고르십시오.', qs:[
   {p:`<p style="text-indent:0"><b>족구</b></p><p>족구는 네트를 사이에 두고 발과 머리만으로 공을 넘기는 운동이다. 경기 규칙은 배구와 비슷하다. 한 팀은 4명의 선수가 경기를 하는데 15점을 먼저 내는 팀이 이긴다. 좁은 공간에서도 공만 있으면 경기를 할 수 있을 뿐만 아니라 (${B}) 규칙이 간단하기 때문에 누구나 쉽게 배울 수 있다.</p>`, o:['족구라는','경기 방법대로','다른 경기에 비해서','경기해 보나 마나'], a:2},
  ]},
 ]},
 b:{title:'읽기', limit:20, groups:[
  {rng:'[1]', h:'다음은 무엇에 대한 글인지 고르십시오.', qs:[
   {p:`<p>국내외 회사 신입 사원 채용 시작, 나에게 맞는 일을 찾을 수 있다!</p>`, pc:'ad', o:['취업','건강','운동','전공'], a:0},
  ]},
  {rng:'[2]', h:'다음 글의 내용과 같은 것을 고르십시오.', qs:[
   {p:`<p class="ad-t">마음의 병, 자연으로 치료!</p><p style="text-align:left;text-indent:1em">학교나 직장에서 계속되는 경쟁과 과로로 힘드십니까? 저희 ‘자연마을’로 오십시오. 바쁘고 복잡했던 생활에서 벗어나 아름다운 나무와 꽃을 보면서 다시 새로운 힘을 얻으실 수 있습니다. 하루 세 끼 자연에서 나온 재료로 만든 웰빙 식사가 제공되며 산책과 명상 등 마음의 건강을 위한 여러 가지 좋은 프로그램들도 준비되어 있습니다.</p><p><b>1인실 : 3만 원 · 2인실 : 5만 원 · 가족실(3인 이상) : 7만 원</b></p>`, pc:'ad', wide:1,
    o:['‘자연마을’은 과로로 힘든 직장인에게 좋은 곳이다.','‘자연마을’에 가면 산책과 명상을 매일 꼭 해야 한다.','‘자연마을’에 가면 식사를 자기가 직접 준비해야 한다.','가족들은 ‘자연마을’에 가면 방이 작아서 불편할 것이다.'], a:0},
  ]},
  {rng:'[3]', h:'다음은 신문 기사의 제목입니다. 가장 잘 설명한 것을 고르십시오.', qs:[
   {p:`한국 여자 핸드볼, 아슬아슬하게 이겨`, pc:'headline', wide:1,
    o:['한국 여자 핸드볼 팀이 반칙 때문에 졌다.','한국 여자 핸드볼 팀이 크게 지고 말았다.','한국 여자 핸드볼 팀이 질 뻔했지만 이겼다.','한국 여자 핸드볼 팀이 큰 점수 차이로 이겼다.'], a:2},
  ]},
  {rng:'[4]', h:'다음을 순서대로 맞게 나열한 것을 고르십시오.', qs:[
   {p:`<div class="items"><p>(가) 팔로 입을 가리고 재채기를 하면 침이 2.5미터를 날아간다고 한다.</p><p>(나) 따라서 가장 좋은 재채기 방법은 바로 휴지로 입을 가리는 것이다.</p><p>(다) 재채기를 할 때 팔이나 손으로 입을 가리고 하면 다른 사람에게 감기를 안 옮길 수 있을까?</p><p>(라) 그에 비해 손으로 입을 가리면 침이 1미터 정도만 튀지만 손바닥에 바이러스가 잔뜩 묻는다.</p></div>`,
    o:['(나)-(다)-(라)-(가)','(다)-(라)-(나)-(가)','(나)-(다)-(가)-(라)','(다)-(가)-(라)-(나)'], a:3},
  ]},
  {rng:'[5–6]', h:'다음을 읽고 ( )에 들어갈 내용으로 가장 알맞은 것을 고르십시오.', qs:[
   {p:`<p>많은 사람들이 ‘나는 아직 나이가 어려서 못 한다.’ 또는 ‘나는 이미 늦었다.’라는 말을 하면서 좋은 기회를 포기한다. 그렇다면 어떤 일을 하기 위해서 가장 좋은 나이는 몇 살일까? 많은 사람들의 생각과는 다르게 그런 나이는 정해져 있지 않다. 세계적으로 유명한 사람들을 보면 아직 어리다고 생각하는 10대부터 꿈을 키운 사람도 있고 모두가 늦었다고 생각하는 40대에 다니던 직장을 그만두고 자신의 적성에 맞는 새로운 일을 찾은 사람도 많다. 이들의 공통점은 나이를 생각하지 않고 자신의 꿈을 위해서 뜨거운 열정으로 열심히 노력했다는 점이다. 꿈을 이루는 데 중요한 것은 (${B})이/가 아니라 (${B})(이)라는 것을 기억하기 바란다.</p>`,
    o:['노력, 꿈','나이, 열정','기회, 나이','적성, 새로운 일'], a:1},
   {p:`<p>아침을 챙겨 먹지 않으면 건강에 안 좋다는 말을 많이 한다. 식사를 하지 않아서 배고프기 때문에 점심에 과식하기 쉬울 뿐만 아니라 장운동이 활발하지 않아 변비가 생기기 쉽다는 것이 그 이유이다. 그러나 원래 아침을 먹지 않았던 사람들은 아침을 거른다고 해서 과식을 하지는 않는다. 그리고 그동안 아침을 먹어 왔던 사람도 아침을 안 먹다 보면 금방 하루 두 끼만 먹는 식사에 적응을 하게 된다. 또한 아침을 먹지 않으면 오히려 장운동을 도와주는 호르몬이 많이 나와 변비를 없애는 데 효과가 있다고 한다. 그러므로 (${B})</p>`, wide:1,

  {rng:'[8]', h:'다음 글의 주제로 가장 알맞은 것을 고르십시오.', qs:[
   {p:`<p>졸업 후 취업이 잘되고 돈을 많이 벌 수 있는 전공이 가장 인기가 있다. 많은 학생들이 자신의 적성을 고려하지 않고 이런 전공을 선택하는 경우가 많다. 나도 마찬가지였다. 부모님과 선생님이 시키는 대로 정말 열심히 공부해서 가장 좋은 의과 대학에 진학했다. 처음 입학했을 때는 세상을 다 가진 것 같았다. 그러나 시간이 지날수록 공부가 힘들어졌고 나는 의학 공부에 소질이 없다는 것을 알게 되었다. 오랫동안 고민한 후에 대학을 그만두고 요리를 배우기 시작했다. 지금은 하루하루가 즐겁고 행복하다. 적성에 안 맞는 공부를 하고 있는 친구들에게 고민하지 말고 자기의 꿈을 찾으라고 말해 주고 싶다.</p>`, wide:1,
    o:['자신의 소질과 적성에 맞는 일을 찾아야 한다.','공부를 열심히 하면 자기의 꿈을 이룰 수 있다.','졸업한 후에 돈을 많이 버는 것이 가장 중요하다.','부모님이 시키는 대로 전공을 선택하는 것이 좋다.'], a:0},

  {rng:'[9–10]', h:'다음을 읽고 물음에 답하십시오.', shared:`<p>항상 몸이 무겁고 아무리 자도 피곤이 풀리지 않는다면 만성피로증후군을 의심해 봐야 한다. 조금만 쉬면 괜찮아질 거라고 가볍게 생각하다가는 문제가 생길 수도 있다. 만성 피로가 하루하루 심해지면 밤에 잠도 자지 못하게 되고 사회생활이나 일상생활이 불가능해질 수도 있기 때문이다.</p><p>만성피로증후군이 생기면 뒷목이 뻣뻣하거나 목이 자주 붓고 눈이 침침하거나 잠을 자도 계속 피곤하고 어떤 일을 자주 잊어버리거나 불안하고 우울할 때가 많아진다. 이러한 증상은 병 때문에 생길 수도 있지만 현대 사회에서는 불규칙한 생활 습관이나 스트레스 때문에 많이 생긴다고 한다.</p><p>만성피로증후군을 치료하려면 무엇보다 제대로 된 식사를 하는 것이 중요하다. 먼저 인스턴트 음식이나 카페인이 많이 들어간 음료를 먹지 말아야 한다. 그리고 칼로리가 높고 기름이 많이 들어간 음식보다는 채소와 과일을 선택해서 먹어야 한다. 만성 피로가 너무 심할 경우에는 의사를 만나서 상담해 보는 것도 좋다.</p>`, qs:[
   {s:'이 글의 내용과 같은 것을 고르십시오.', wide:1,
    o:['만성피로증후군은 보통 조금만 쉬면 괜찮아진다.','만성피로증후군이 심해지면 일상생활을 하기 힘들 수 있다.','만성피로증후군은 스트레스 때문이 아니라 병 때문에 생긴다.','영양이 풍부하고 칼로리가 높은 음식은 만성피로증후군에 효과적이다.'], a:1},
   {s:'만성피로증후군의 증상으로 맞지 <u>않는</u> 것을 고르십시오.', wide:1,
    o:['목이 뻣뻣하거나 붓는다.','평소보다 눈이 침침하다.','피곤해서 밤에 잠이 잘 온다.','기억을 잘 못하고 자주 우울하다.'], a:2},
  ]},
  {rng:'[11–12]', h:'다음을 읽고 물음에 답하십시오.', shared:`<p>운동을 하는 것은 건강에 좋지만 자신의 몸에 맞는 운동을 찾아 하는 것이 더 효과적이다. 자신에게 맞지 않거나 무리한 운동은 오히려 신체를 피로하게 만들고 잘못하면 다칠 수도 있다. 나이에 맞는 운동법은 무엇이 있는지 소개하도록 하겠다.</p><div class="items"><p>• 몸이 성장하는 청소년기에는 규칙적인 운동을 하면 키가 크는 데 도움을 준다. 그리고 스트레칭을 하면 많은 근육에 자극을 주어 바른 자세를 만드는 데 좋다.</p><p>• 2·30대 직장인들은 수업을 듣거나 사무실에서 일을 하는 등 청소년들에 비해서 앉아 있는 시간이 긴 편이다. 이럴 경우 하체가 부어 하체 비만이 생길 수 있다. 의자에 앉아서 발끝을 세웠다 놓았다를 반복하면 다리가 붓고 하체 비만이 되는 것을 예방할 수 있다.</p><p>• 중년층의 경우 조깅처럼 몸에 무리가 가지 않는 운동을 조금씩 꾸준히 하는 것이 좋다. 조깅은 뛰는 것보다 빠른 걸음으로 30분 이상 꾸준히 걷는 것이 좋다.</p><p>• 60대 이상 노년층의 경우 운동 전에는 충분히 몸을 풀어 주고, 걷기나 수영 등 관절에 무리가 가지 않는 운동을 선택해 하는 것이 좋다.</p></div>`, qs:[
   {s:'이 글의 내용과 같은 것을 고르십시오.', wide:1,
    o:['청소년들은 스트레칭을 하면 근육이 쉽게 피로해진다.','중년층은 무리가 안 가도록 30분 이내로 운동해야 한다.','노년층은 관절에 무리가 가니까 걷기나 수영 등은 피한다.','직장인들은 청소년들에 비해서 하체 비만이 생기기가 쉽다.'], a:3},
   {s:'이 글의 제목으로 알맞은 것을 고르십시오.', wide:1,
    o:['여러 가지 운동과 효과','나이에 맞는 좋은 운동법','키 크는 데 효과적인 운동','건강에 좋은 운동과 나쁜 운동'], a:1},
  ]},
 ]},
};
const MARK=['①','②','③','④'];
const state={a:null,b:null}; let cur='a', tick=null;

function shuffle(n){const p=[...Array(n).keys()];
  // keep shuffling until the order differs from the original
  do{for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];}}while(p.every((v,i)=>v===i));
  return p;}
function fresh(k){const qs=SECTIONS[k].groups.flatMap(g=>g.qs);
  return {order:qs.map(q=>shuffle(q.o.length)), pick:qs.map(()=>null), graded:false, left:SECTIONS[k].limit*60};}

function render(){
  const sec=SECTIONS[cur], st=state[cur]; let n=0;
  let html=`<section class="sheet ${st.graded?'graded':''}"><h1>${sec.title}</h1><p class="sub">제한 시간 ${sec.limit}분 · 선택지 순서는 원본과 다르게 섞여 있습니다.</p>`;
  sec.groups.forEach(g=>{
    html+=`<div class="group"><p class="group-h"><span class="rng">${g.rng}</span><span>${g.h}</span></p>`;
    if(g.shared) html+=`<div class="passage">${g.shared}</div>`;
    g.qs.forEach(q=>{const i=n++;
      html+=`<div class="q">`;
      const num=sec===SECTIONS.a?i+1:i+1;
      if(q.p){html+=`<div class="q-t"><span class="n">${num}.</span></div><div class="passage ${q.pc||''}">${q.p}</div>`;
        if(q.bogi) html+=`<div class="bogi">${q.bogi}</div>`;}
      else html+=`<p class="q-t"><span class="n">${num}.</span><span class="s">${q.s}</span></p>`;
      html+=`<div class="opts ${q.wide?'wide':''}" role="radiogroup" aria-label="${num}번 선택지">`;
      st.order[i].forEach((orig,pos)=>{
        let c='opt'; let v='';
        if(st.pick[i]===orig) c+=' sel';
        if(st.graded){ if(orig===q.a){c+=' ok'; if(st.pick[i]===orig) v='<span class="verdict ok">정답</span>'; else v='<span class="verdict ok">정답</span>';}
          else if(st.pick[i]===orig){c+=' bad'; v='<span class="verdict bad">오답</span>';}}
        html+=`<button type="button" class="${c}" id="o-${cur}-${i}-${pos}" role="radio" aria-checked="${st.pick[i]===orig}" data-q="${i}" data-o="${orig}"><span class="m">${MARK[pos]}</span><span>${q.o[orig]}</span>${v}</button>`;
      });
      html+=`</div></div>`;
    });
    html+=`</div>`;
  });
  const total=st.pick.length, done=st.pick.filter(v=>v!==null).length;
  html+=`<div class="actions">`;
  if(!st.graded) html+=`<button class="btn" id="grade">채점하기</button><span class="note">${done} / ${total}문항 선택함</span>`;
  else html+=`<span class="result">${score(cur)} / ${total}점</span><span class="save ${st.saveCls||''}">${st.saveMsg||''}</span>`;
  html+=`<button class="btn ghost" id="reset">선택지 다시 섞고 새로 풀기</button></div></section>`;
  document.getElementById('app').innerHTML=html;
  updMeta();
}
function score(k){const qs=SECTIONS[k].groups.flatMap(g=>g.qs);return state[k].pick.filter((p,i)=>p===qs[i].a).length;}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function updMeta(){const st=state[cur];
  document.getElementById('timer').textContent=st.left>0?fmt(st.left):'시간 종료';
  document.getElementById('score').textContent=st.graded?`${score(cur)} / ${st.pick.length}`:'–';}
function startTimer(){clearInterval(tick);tick=setInterval(()=>{const st=state[cur];if(!st.graded&&st.left>0){st.left--;updMeta();}},1000);}

document.addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(t){cur=t.dataset.sec;
    document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b===t));
    if(!state[cur]) state[cur]=fresh(cur); render(); window.scrollTo(0,0); return;}
  const o=e.target.closest('.opt'); if(o&&!state[cur].graded){state[cur].pick[+o.dataset.q]=+o.dataset.o; const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(e.target.id==='grade'){
    const idEl=document.getElementById('sid'), nm=document.getElementById('sname');
    const studentId=idEl.value.trim(), studentName=nm.value.trim();
    idEl.classList.toggle('need',!studentId); nm.classList.toggle('need',!studentName);
    if(!studentId||!studentName){(studentId?nm:idEl).focus(); window.scrollTo(0,0); return;}
    const k=cur, st=state[k]; st.graded=true; st.saveMsg='결과를 저장하는 중…'; st.saveCls=''; render();
    const qs=SECTIONS[k].groups.flatMap(g=>g.qs);
    const answers=qs.map((q,i)=>({no:i+1, chosen:st.pick[i]===null?null:st.pick[i]+1, answer:q.a+1, correct:st.pick[i]===q.a}));
    const payload={quiz:'4A 1-3 review', section:SECTIONS[k].title, studentId, studentName, score:score(k), total:qs.length,
      wrong:answers.filter(a=>!a.correct).map(a=>a.no), '문항별_답':answers, secondsUsed:SECTIONS[k].limit*60-st.left};
    (window.saveResult?window.saveResult(payload):Promise.reject(new Error('Firebase 미설정')))
      .then(()=>{st.saveMsg='선생님께 결과를 보냈습니다.';st.saveCls='ok';})
      .catch(err=>{console.error(err);st.saveMsg='결과 저장 실패: '+err.message;st.saveCls='bad';})
      .finally(()=>{if(cur===k){const y=window.scrollY;render();window.scrollTo(0,y);}});
    return;}
  if(e.target.id==='reset'){state[cur]=fresh(cur); render(); window.scrollTo(0,0);}
});
state.a=fresh('a'); render(); startTimer();
</script>
